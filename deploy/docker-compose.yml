# Stack del Ledger. Requiere la red "backend" y el contenedor "postgres" del compose de ~/servicios/postgres.
# Uso (desde la carpeta deploy/):  docker compose --env-file .env up -d --build
services:
  ledger-api:
    build: ../backend
    container_name: ledger-api
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/ledger
      DB_USER: ledger_user
      DB_PASSWORD: ${LEDGER_DB_PASSWORD}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      RECEIPTS_SIGNING_SECRET: ${RECEIPTS_SIGNING_SECRET}
      APP_TIMEZONE: Europe/Madrid
      # Bot de Telegram: clave compartida y usuario (uid de Firebase) sobre el que actua
      BOT_API_KEY: ${BOT_API_KEY:?Falta BOT_API_KEY en deploy/.env}
      BOT_UID: ${BOT_UID:?Falta BOT_UID en deploy/.env}
    volumes:
      - ledger_receipts:/data/receipts
    networks:
      - backend
    # el puerto 8080 NO se publica: solo nginx llega a la API por la red interna

  ledger-web:
    build:
      context: ..
      args:
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
        VITE_FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID}
    container_name: ledger-web
    restart: unless-stopped
    depends_on:
      - ledger-api
    ports:
      # solo en loopback: se expone a tu tailnet con "tailscale serve", no a la WiFi ni a internet
      - "127.0.0.1:8081:80"
    networks:
      - backend

  ledger-bot:
    build: ../bot
    container_name: ledger-bot
    restart: unless-stopped
    depends_on:
      - ledger-api
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Falta TELEGRAM_BOT_TOKEN en deploy/.env}
      ALLOWED_TELEGRAM_ID: ${ALLOWED_TELEGRAM_ID:?Falta ALLOWED_TELEGRAM_ID en deploy/.env}
      BOT_API_KEY: ${BOT_API_KEY}
      LEDGER_API_URL: http://ledger-api:8080
      TZ: Europe/Madrid
    networks:
      - backend
    # sin puertos publicados: el bot solo hace peticiones salientes (long polling)

volumes:
  ledger_receipts:

networks:
  backend:
    external: true
    name: backend
