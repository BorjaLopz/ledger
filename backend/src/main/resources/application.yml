server:
  port: 8080
  forward-headers-strategy: framework

spring:
  application:
    name: ledger-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ledger}
    username: ${DB_USER:ledger_user}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    default-property-inclusion: always

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  firebase:
    project-id: ${FIREBASE_PROJECT_ID}
  timezone: ${APP_TIMEZONE:Europe/Madrid}
  receipts:
    dir: ${RECEIPTS_DIR:/data/receipts}
    signing-secret: ${RECEIPTS_SIGNING_SECRET}
    url-ttl-seconds: 43200
